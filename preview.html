<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Toolbar Preview — Prompt Enhancer Pro</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #2b2a27;
      color: #e0ddd5;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .mock-header {
      text-align: center;
      margin-bottom: 40px;
    }
    .mock-header h1 {
      font-size: 32px;
      color: #c4bfb2;
      font-weight: 400;
    }
    .mock-header .icon { font-size: 28px; }
    .mock-chat-area {
      width: 700px;
      max-width: 90vw;
    }
    .mock-input-container {
      background: rgba(255,255,255,0.08);
      border-radius: 16px;
      padding: 16px;
    }
    .mock-textarea {
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: #e0ddd5;
      font-size: 16px;
      resize: none;
      min-height: 60px;
      font-family: inherit;
    }
    .mock-textarea::placeholder { color: rgba(200,200,200,0.4); }
    .mock-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 8px;
      padding-top: 8px;
    }
    .mock-model {
      font-size: 13px;
      color: rgba(200,200,200,0.5);
    }
    .preview-label {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(124,58,237,0.15);
      border: 1px solid rgba(124,58,237,0.3);
      padding: 8px 20px;
      border-radius: 20px;
      font-size: 12px;
      color: rgba(200,200,220,0.8);
      font-weight: 600;
    }
  </style>
  <link rel="stylesheet" href="content.css">
</head>
<body>
  <div class="preview-label">📐 This is a preview of how the toolbar appears above the chat input</div>

  <div class="mock-header">
    <span class="icon">✳️</span>
    <h1>Afternoon, praveen kumar</h1>
  </div>

  <div class="mock-chat-area">
    <!-- THE TOOLBAR IS INJECTED HERE -->
    <div id="pe-toolbar">
      <div class="pe-brand">
        <span class="pe-brand-icon">⚡</span>
        <span class="pe-brand-text">Enhancer Pro</span>
      </div>

      <div class="pe-modes">
        <button class="pe-mode-btn pe-active" data-mode="general">
          <span class="pe-mode-emoji">🎯</span> General
        </button>
        <button class="pe-mode-btn" data-mode="coding">
          <span class="pe-mode-emoji">💻</span> Code
        </button>
        <button class="pe-mode-btn" data-mode="creative">
          <span class="pe-mode-emoji">🎨</span> Creative
        </button>
        <button class="pe-mode-btn" data-mode="research">
          <span class="pe-mode-emoji">🔬</span> Research
        </button>
        <button class="pe-mode-btn" data-mode="image">
          <span class="pe-mode-emoji">🖼️</span> Image
        </button>
      </div>

      <div class="pe-intensity">
        <button class="pe-int-btn" data-intensity="light">L</button>
        <button class="pe-int-btn pe-active" data-intensity="medium">M</button>
        <button class="pe-int-btn" data-intensity="heavy">H</button>
      </div>

      <div class="pe-spacer"></div>

      <div class="pe-score-badge" id="pe-score-badge">
        <span>Score:</span>
        <span class="pe-score-val" id="pe-score-val">--</span>
      </div>

      <div class="pe-actions">
        <button class="pe-analyze-btn">🔍 Analyze</button>
        <button class="pe-enhance-btn">
          <span class="pe-btn-content">⚡ Enhance</span>
          <span class="pe-spinner"></span>
        </button>
        <button class="pe-minimize-btn">─</button>
      </div>
    </div>

    <!-- Mock chat input (like Claude) -->
    <div class="mock-input-container">
      <textarea class="mock-textarea" placeholder="How can I help you today?" rows="3">Write me a python script to scrape web data</textarea>
      <div class="mock-footer">
        <span>+</span>
        <span class="mock-model">Sonnet 4.6 Adaptive ▾</span>
      </div>
    </div>
  </div>

  <script>
    // Interactive demo
    document.querySelectorAll('.pe-mode-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.pe-mode-btn').forEach(b => b.classList.remove('pe-active'));
        btn.classList.add('pe-active');
      });
    });
    document.querySelectorAll('.pe-int-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.pe-int-btn').forEach(b => b.classList.remove('pe-active'));
        btn.classList.add('pe-active');
      });
    });
    document.querySelector('.pe-minimize-btn').addEventListener('click', () => {
      const tb = document.getElementById('pe-toolbar');
      tb.classList.toggle('pe-minimized');
      document.querySelector('.pe-minimize-btn').textContent = tb.classList.contains('pe-minimized') ? '▸' : '─';
    });
    document.querySelector('.pe-enhance-btn').addEventListener('click', () => {
      const btn = document.querySelector('.pe-enhance-btn');
      btn.classList.add('pe-loading');
      btn.disabled = true;
      setTimeout(() => { btn.classList.remove('pe-loading'); btn.disabled = false; }, 2000);
    });
  </script>
</body>
</html>
